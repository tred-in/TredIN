<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TredIN — Fund Control</title><style>body{margin:0;font:15px system-ui;background:#0b0f16;color:#eaf0f7}main{max-width:760px;margin:40px auto;padding:24px}section{background:#121923;border:1px solid #263244;border-radius:18px;padding:20px;margin-bottom:16px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #334155;background:#0c131d;color:#fff}button{cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.results button{text-align:left}.muted{color:#94a3b8}.ok{color:#6ee7b7}.err{color:#fb7185}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Fund Control</h1><p class="muted">Admin-only customer search and controlled fund credit.</p><section id="login"><h2>Admin Login</h2><input id="loginId" placeholder="Admin User ID / email"><input id="loginPw" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="loginMsg"></div></section><section id="control" hidden><h2>Find & Copy Customer</h2><input id="search" placeholder="User ID / name / mobile / email"><button onclick="findUsers()">Find Customer</button><div id="results" class="results"></div><div class="grid"><input id="userId" placeholder="Selected User ID" readonly><input id="amount" type="number" min="1" step="0.01" placeholder="Amount"></div><input id="reason" maxlength="240" placeholder="Reason"><button onclick="credit()">Add Funds</button><div id="msg"></div></section></main><script>const api='https://tredin-core-live-production.up.railway.app';let token='';function setMsg(id,text,cls=''){const e=document.getElementById(id);e.textContent=text;e.className=cls}async function login(){setMsg('loginMsg','Signing in…');const r=await fetch(api+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:loginId.value.trim(),password:loginPw.value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.token)return setMsg('loginMsg',d.error||'Login failed','err');if(!['SUPER_ADMIN','OPERATIONS_ADMIN','FINANCE_ADMIN','READ_ONLY_ADMIN'].includes(d.user?.role))return setMsg('loginMsg','This account is not an allowed Admin role.','err');token=d.token;document.getElementById('login').hidden=true;document.getElementById('control').hidden=false;setMsg('msg','Admin authenticated.','ok')}async function findUsers(){const q=search.value.trim();if(q.length<2)return setMsg('msg','Enter at least 2 characters.','err');const r=await fetch(api+'/admin/funds/users?search='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok)return setMsg('msg',d.error||'Search failed','err');results.innerHTML=d.users.map(u=>`<button onclick="selectUser('${String(u.user_id).replace(/'/g,"\\'")}')"><b>${u.user_id}</b> — ${u.full_name||''}<br><span class="muted">${u.mobile||''} ${u.email||''}</span></button>`).join('')||'<p class="muted">No customers found.</p>'}function selectUser(id){userId.value=id;setMsg('msg','Customer selected: '+id,'ok')}async function credit(){const uid=userId.value.trim(),amt=Number(amount.value),why=reason.value.trim();if(!uid||!Number.isFinite(amt)||amt<=0||!why)return setMsg('msg','Select customer, amount and reason.','err');const key=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());const r=await fetch(api+'/admin/funds/credit',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,'Idempotency-Key':key},body:JSON.stringify({userId:uid,amount:amt,reason:why})});const d=await r.json().catch(()=>({}));if(!r.ok)return setMsg('msg',d.error||'Fund credit failed','err');setMsg('msg',`Fund added successfully. Balance: ${d.balanceBefore} → ${d.balanceAfter}`,'ok');amount.value='';reason.value=''}</script></body></html>
